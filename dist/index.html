<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dušan Hlavatý — DevOps &amp; Backend Engineer</title>
  <meta name="description" content="DevOps and Backend Engineer based in Slovakia.">
  <meta name="theme-color" content="#0b0a10">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%238f84c2' fill-rule='evenodd' d='M37 3C53 2 63 13 61 27C59 41 47 49 33 49C27 49 21 52 15 58C11 62 5 61 6 56C7 52 12 47 16 43C6 37 4 25 10 16C16 7 26 3 37 3ZM46.8 19.4A9.5 6.2 -28 1 0 30 28.4A9.5 6.2 -28 1 0 46.8 19.4Z'/%3E%3C/svg%3E">
  <style>
    html, body { margin: 0; height: 100%; background: #0b0a10; color: #d9d6e4; }
    body { overflow: hidden; }
    .landing {
      display: grid; place-items: center; height: 100%;
      font: 16px/1.5 ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    }
    .boot-prompt {
      appearance: none; background: none; border: 0; border-radius: 4px; color: inherit; font: inherit;
      font-size: clamp(15px, 2.4vw, 19px); letter-spacing: .02em; padding: 14px 18px; cursor: pointer;
    }
    .boot-prompt:focus { outline: none; }
    .boot-prompt:focus-visible { outline: 2px solid #a79de0; outline-offset: 4px; }
    .boot-prompt kbd { font: inherit; color: #fff; font-weight: 600; }
    .cursor {
      display: inline-block; width: .62em; height: 1.2em; margin-left: .2em; vertical-align: -.22em;
      background: currentColor; animation: blink 1.06s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .tap { display: none; }
    @media (hover: none) and (pointer: coarse) { .key { display: none; } .tap { display: inline; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    .status { position: fixed; bottom: 16px; left: 16px; right: 16px; margin: 0; text-align: center; color: #ff8f8f; font: 13px/1.4 ui-monospace, monospace; }
  </style>
</head>
<body>
  <main id="landing" class="landing">
    <button id="boot-button" class="boot-prompt" type="button" autofocus>
      <span class="key">Press <kbd>Enter</kbd> to boot</span><span class="tap">Tap to boot</span><span class="cursor" aria-hidden="true"></span>
    </button>
    <p id="boot-status" class="status" role="status" aria-live="polite"></p>
  </main>
  <noscript><p style="position:fixed;inset:auto 0 24px;text-align:center;font-family:monospace">This site is a small Linux machine in your browser and needs JavaScript to boot.</p></noscript>
  <script type="module">
    const button = document.getElementById('boot-button');
    const status = document.getElementById('boot-status');
    let booting = false;
    let skipRequested = false;

    function boot() {
      if (booting) return;
      booting = true;
      button.disabled = true;
      // Nothing beyond this page is fetched until the visitor asks to boot.
      import('./b-413e8a310d/os/main.js')
        .then((os) => os.start({ skipRequested: () => skipRequested }))
        .then(() => document.removeEventListener('keydown', onKey))
        .catch((err) => {
          console.error(err);
          status.textContent = 'Kernel panic: failed to load the system. Reload the page to try again.';
          booting = false;
          button.disabled = false;
        });
    }

    function onKey(e) {
      if (!booting) {
        if (e.key === 'Enter' && !e.repeat) { e.preventDefault(); boot(); }
      } else if (e.key === 'Escape') {
        skipRequested = true; // pressed before the boot screen exists
      }
    }
    document.addEventListener('keydown', onKey);
    button.addEventListener('click', boot);
    button.focus();
  </script>
</body>
</html>
